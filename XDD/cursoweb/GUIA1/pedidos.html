<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos -Panadería Santa Rosa | Pan caliente todos los días</title>
</head>  
<footer id="Contacto">
    <h2>Visítanos</h2>
    <address>
        Av. Los Panaderos 123 <br>
        celular:<a href="index.html#contacto">+51 987 654 321</a> <br>
    </address>
    <p>
        Lunes a sábado de 6:00 a 21:00 · Domingos de 6:00 a 13:00
    </p>
</footer>
<main>
    <h1>Haz tu pedido</h1>
    <p>Te confirmaremos en WhatsApp en menos de una hora.</p>

    <form action="#" >
        <fieldset>
            <legend>Tus Datos</legend>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="celular">celular:</label>
            <input type="tel" id="telefono" name="telefono" required>
        
        </fieldset>
        <fieldset>
            <legend>
                <legend>Tu pedido</legend>
                <label for="producto">Producto</label>
                <select id="producto" name="producto" required>
                   <option value="">Elige un producto</option>
                   <option>Pan francés</option>
                   <option>Pan de yema</option>
                   <option>Chancay</option>
                   <option>Torta de chocolate</option>
                </select>
                <label for="cantidad">Cantidad</label>
                <input type="number" id="cantidad" name="cantidad" min="1" value="1" required>
                <label for="fecha">Fecha de recojo</label>
                <input type="date" id="fecha" name="fecha" required>
                <label for="notas">Indicaciones (opcional)</label>
                <textarea id="notas" name="notas" rows="3"></textarea>
        </fieldset>
        
        <input type="checkbox" id="consentimiento" name="consentimiento" required>
        <label for="consentimiento">Autorizo que usen mis datos solo para atender este pedido.</label>
        
        <button type="submit">Enviar pedido</button>
    </form>
        
</main>
